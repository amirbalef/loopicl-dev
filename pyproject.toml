[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopicl"
version = "0.1.0"
description = "LoopICL — a looped in-context learning foundation model for tabular data"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Anonymous", email = "anonymous@example.com" }
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "einops>=0.7",
    "wandb>=0.16",
    "tqdm>=4.65",
    "transformers>=4.40",
    "scipy>=1.11",
    "joblib>=1.3",
    "psutil>=5.9",
    "xgboost>=2.0",
]

[project.scripts]
genload = "loopicl.priors.tabicl_v2.genload:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
openml = ["openml>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
